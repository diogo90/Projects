[tool.poetry]
name = "f1-qualifying-dashboard"
version = "0.1.0"
description = "F1 qualifying performance analysis pipeline"
authors = ["diogo90 <diogo90@users.noreply.github.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastf1 = "^3.3.0"
duckdb = "^1.5.0"
pandas = "^2.2.0"
pyarrow = "^15.0.0"
loguru = "^0.7.3"
pydantic = "^2.12.5"
fire = "^0.7.1"
dbt-core = "^1.11.7"
dbt-duckdb = "^1.10.1"

[tool.poetry.group.dev.dependencies]
ipykernel = "^7.2.0"
pytest = "^9.0.2"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=5.0.0,<6.0.0)",
    "ruff (>=0.15.7,<0.16.0)",
    "black (>=24.0.0,<25.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "dbt-duckdb (>=1.10.1,<2.0.0)"
]