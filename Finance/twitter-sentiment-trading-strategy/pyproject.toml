[tool.poetry]
name = "twitter-sentiment-trading-strategy"
version = "0.1.0"
description = ""
authors = ["diogo90 <diogo90@users.noreply.github.com>"]

[tool.poetry.dependencies]
python = "^3.11"
duckdb = ">=1.5.0,<2.0.0"
pyarrow = ">=23.0.1,<24.0.0"
pandas = ">=3.0.1,<4.0.0"
fire = ">=0.7.1,<0.8.0"
loguru = ">=0.7.3,<0.8.0"
pydantic = ">=2.12.5,<3.0.0"
dbt-duckdb = "^1.10.1"
yfinance = "^1.2.0"
matplotlib = "^3.10.8"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "ruff (>=0.15.7,<0.16.0)",
    "ipykernel (>=7.2.0,<8.0.0)"
]
